<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><title>Membres</title>
        <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
</style>
</head>
<body>
<h1>Liste des membres</h1>

<a href="{% url 'creer_membre' %}">+ Ajouter un membre</a>

<table border="1">
    <tr><th>Nom</th><th>Prénom</th><th>Email</th><th>Actions</th></tr>
    {% for membre in membres %}
    <tr>
        <td>{{ membre.nom }}</td>
        <td>{{ membre.prenom }}</td>
        <td>{{ membre.email }}</td>
        <td>
            <a href="{% url 'modifier_membre' membre.id %}">Modifier</a>
            <a href="{% url 'supprimer_membre' membre.id %}">Supprimer</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Aucun membre</td></tr>
    {% endfor %}
</table>
</body>
</html>
